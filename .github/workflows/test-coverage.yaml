on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

name: test-coverage

jobs:
  test-coverage:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ## at most 2 cores for the tests, as CRAN asks (tests/testthat/setup-cores.R)
      OMP_THREAD_LIMIT: 2
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: PredictiveEcology/actions/install-spatial-deps@main
        id: spatial

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://PredictiveEcology.r-universe.dev/'
          Ncpus: 2
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # key the cache on the GDAL/GEOS/PROJ versions too, so a library built
          # against other system libraries is never restored (empty on Windows)
          cache-version: ${{ steps.spatial.outputs.abi && format('1-{0}', steps.spatial.outputs.abi) || '1' }}
          extra-packages: |
            any::covr

      - name: Test coverage
        run: covr::codecov()
        shell: Rscript {0}
